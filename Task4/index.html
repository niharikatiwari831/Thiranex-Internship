<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌤 Weather Dashboard</h1>

        <div class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name">

            <button id="searchBtn">
                Search
            </button>
        </div>

        <div id="loading" class="loading">
            Loading...
        </div>

        <div id="error" class="error"></div>

        <div class="weather-card" id="weatherCard">

            <h2 id="cityName"></h2>

            <img id="weatherIcon">

            <h1 id="temperature"></h1>

            <p id="description"></p>

            <div class="details">

                <div class="box">
                    <h3>Humidity</h3>
                    <p id="humidity"></p>
                </div>

                <div class="box">
                    <h3>Wind Speed</h3>
                    <p id="wind"></p>
                </div>

                <div class="box">
                    <h3>Feels Like</h3>
                    <p id="feels"></p>
                </div>

            </div>

        </div>

    </div>

<script src="script.js"></script>

</body>
</html>
